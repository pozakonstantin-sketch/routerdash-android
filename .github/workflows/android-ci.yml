name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "**/*.kt"
      - "**/*.xml"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "**/*.kt"
      - "**/*.xml"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android sdkmanager not found under $ANDROID_HOME"
            find /usr/local/lib/android -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi
          SDK_BIN="$(dirname "$SDKMANAGER")"
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: routerdash-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
